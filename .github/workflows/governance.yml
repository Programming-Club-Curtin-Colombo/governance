name: Governance Self-Test

# This workflow is for validating the governance engine itself.
# Consumer repositories use ci.yml as the standard pipeline.
# Push enforcement is intentionally omitted here — the engine
# has no CI output to evaluate against itself.

on:
  pull_request:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  governance:
    name: Governance Engine
    runs-on: ubuntu-latest

    outputs:
      allowed: ${{ steps.governance.outputs.allowed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Governance
        id: governance
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          discord-webhook-url: ${{ secrets.DISCORD_AUDIT_WEBHOOK_URL }}
          governance-webhook-url: ${{ secrets.GOVERNANCE_WEBHOOK_URL }}

  enforce:
    name: Enforce Governance
    runs-on: ubuntu-latest
    needs: governance

    steps:
      - name: Validate Governance Result
        run: |
          if [ "${{ needs.governance.outputs.allowed }}" != "true" ]; then
            echo "[GOVERNANCE] BLOCKED"
            exit 1
          fi

          echo "[GOVERNANCE] PASSED"
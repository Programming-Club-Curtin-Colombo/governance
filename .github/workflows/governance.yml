name: Governance Pipeline

on:
  pull_request:
  pull_request_target:

jobs:
  governance:
    name: Run Governance Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @actions/core @actions/github

      - name: Run Governance Engine
        run: node engine/run.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_AUDIT_WEBHOOK_URL: ${{ secrets.DISCORD_AUDIT_WEBHOOK_URL }}

  enforce:
    name: Enforce Result Gate
    runs-on: ubuntu-latest
    needs: governance

    steps:
      - name: Final Gate Check
        run: |
          echo "Governance evaluation completed"
          echo "This job is reserved for branch protection / future merge gating"
name: "Programming Club Governance"
description: "Centralised governance engine for PR validation, role labelling, and structured audit event routing"

branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    required: true
    description: "GitHub token with pull-requests:write and issues:write permissions"

  discord-webhook-url:
    required: false
    description: "Discord webhook URL for audit event notifications"
    default: ""

  governance-webhook-url:
    required: false
    description: "Generic HTTP webhook URL for raw audit event delivery"
    default: ""

  governance-version:
    required: false
    description: "Pin a specific governance policy version (e.g. v1.2.0). Defaults to main."
    default: ""

  build-status:
    required: false
    description: "Output of the build job ('true' if passed, 'false' or empty if not)"
    default: ""

  lint-status:
    required: false
    description: "Output of the lint job ('true' if passed, 'false' or empty if not)"
    default: ""

  test-status:
    required: false
    description: "Output of the test job ('true' if passed, 'false' or empty if not)"
    default: ""

  security-status:
    required: false
    description: "Output of the security job ('true' if passed, 'false' or empty if not)"
    default: ""

  static-status:
    required: false
    description: "Output of the static analysis job ('true' if passed, 'false' or empty if not)"
    default: ""

  benchmark-status:
    required: false
    description: "Output of the benchmark job ('true' if passed, 'false' or empty if not)"
    default: ""


outputs:
  allowed:
    description: "Whether the PR passed governance (true or false)"
    value: ${{ steps.engine.outputs.allowed }}

  role:
    description: "Resolved contributor role (student, external, or maintainer)"
    value: ${{ steps.engine.outputs.role }}

  type:
    description: "Classified PR type (feature, bug, infra, or docs)"
    value: ${{ steps.engine.outputs.type }}

runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm init -y
        npm install @actions/core@1.10.1 @actions/github@6.0.0

    - name: Run Engine
      id: engine
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node engine/run.js
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_DISCORD-WEBHOOK-URL: ${{ inputs.discord-webhook-url }}
        INPUT_GOVERNANCE-WEBHOOK-URL: ${{ inputs.governance-webhook-url }}
        INPUT_GOVERNANCE-VERSION: ${{ inputs.governance-version }}
        INPUT_BUILD-STATUS: ${{ inputs.build-status }}
        INPUT_LINT-STATUS: ${{ inputs.lint-status }}
        INPUT_TEST-STATUS: ${{ inputs.test-status }}
        INPUT_SECURITY-STATUS: ${{ inputs.security-status }}
        INPUT_STATIC-STATUS: ${{ inputs.static-status }}
        INPUT_BENCHMARK-STATUS: ${{ inputs.benchmark-status }}
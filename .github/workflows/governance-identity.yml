name: Governance Identity Check

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: ".governance.json"

jobs:
  identity-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # =========================
      # Checkout calling repo
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Setup Node
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # Run governance engine
      # =========================
      - name: Run governance check
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node identity-check.js
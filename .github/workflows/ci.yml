name: Standard CI Pipeline

on:
  pull_request:
  push:

jobs:

  # =========================================
  # BUILD
  # =========================================
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build
        run: echo "[BUILD] Not implemented — placeholder"

      - name: Emit build.log
        run: |
          echo "[BUILD] Placeholder build log" > build.log
          echo "Status: passed" >> build.log

      - name: Emit build-summary.json
        run: |
          echo '{
            "job": "build",
            "status": "passed",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
            "reports": [{ "name": "General", "status": "passed", "comment": "Placeholder build passed" }]
          }' > build-summary.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            build.log
            build-summary.json

      - name: Set Build Result
        id: result
        run: echo "passed=true" >> $GITHUB_OUTPUT


  # =========================================
  # LINT
  # =========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Lint
        run: echo "[LINT] Not implemented — placeholder"

      - name: Emit eslint.sarif
        run: |
          cat > eslint.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": { "driver": { "name": "ESLint", "version": "0.0.0", "rules": [] } },
              "results": []
            }]
          }
          EOF

      - name: Upload Lint Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: eslint.sarif

      - name: Set Lint Result
        id: result
        run: echo "passed=true" >> $GITHUB_OUTPUT


  # =========================================
  # STATIC ANALYSIS
  # =========================================
  static:
    name: Static Analysis
    runs-on: ubuntu-latest

    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Static Analysis
        run: echo "[STATIC] Not implemented — placeholder"

      - name: Emit codeql.sarif
        run: |
          cat > codeql.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": { "driver": { "name": "CodeQL", "version": "0.0.0", "rules": [] } },
              "results": []
            }]
          }
          EOF

      - name: Upload Static Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-report
          path: codeql.sarif

      - name: Set Static Result
        id: result
        run: echo "passed=true" >> $GITHUB_OUTPUT


  # =========================================
  # TEST
  # =========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Tests
        run: echo "[TEST] Not implemented — placeholder"

      - name: Emit junit.xml
        run: |
          cat > junit.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Placeholder" tests="1" failures="0" errors="0" time="0">
            <testsuite name="Placeholder" tests="1" failures="0" errors="0" time="0">
              <testcase name="placeholder" classname="placeholder" time="0"/>
            </testsuite>
          </testsuites>
          EOF

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: junit.xml

      - name: Set Test Result
        id: result
        run: echo "passed=true" >> $GITHUB_OUTPUT


  # =========================================
  # SECURITY
  # =========================================
  security:
    name: Security
    runs-on: ubuntu-latest

    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Security Scan
        run: echo "[SECURITY] Not implemented — placeholder"

      - name: Emit trivy.sarif
        run: |
          cat > trivy.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": { "driver": { "name": "Trivy", "version": "0.0.0", "rules": [] } },
              "results": []
            }]
          }
          EOF

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: trivy.sarif

      - name: Set Security Result
        id: result
        run: echo "passed=true" >> $GITHUB_OUTPUT


  # =========================================
  # GOVERNANCE
  # =========================================
  governance:
    name: Governance
    runs-on: ubuntu-latest

    if: always()

    needs:
      - build
      - lint
      - static
      - test
      - security

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    outputs:
      allowed: ${{ steps.governance.outputs.allowed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Install Engine Dependencies
        run: npm install --prefix ${{ github.workspace }} @actions/core@1.10.1 @actions/github@6.0.0

      - name: Run Governance Engine
        id: governance
        working-directory: ${{ github.workspace }}
        run: node engine/run.js
        env:
          INPUT_GITHUB-TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          INPUT_DISCORD-WEBHOOK-URL:    ${{ secrets.DISCORD_AUDIT_WEBHOOK_URL }}
          INPUT_GOVERNANCE-WEBHOOK-URL: ${{ secrets.GOVERNANCE_WEBHOOK_URL }}
          INPUT_BUILD-STATUS:           ${{ needs.build.outputs.passed }}
          INPUT_LINT-STATUS:            ${{ needs.lint.outputs.passed }}
          INPUT_STATIC-STATUS:          ${{ needs.static.outputs.passed }}
          INPUT_TEST-STATUS:            ${{ needs.test.outputs.passed }}
          INPUT_SECURITY-STATUS:        ${{ needs.security.outputs.passed }}

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: ci-html-report
          path: ci-report.html

      - name: Upload Governance Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-archive
          path: artifacts/
          if-no-files-found: warn


  # =========================================
  # ENFORCEMENT GATE
  # =========================================
  enforce:
    name: Enforce Governance
    runs-on: ubuntu-latest

    needs:
      - governance

    if: always()

    steps:
      - name: Validate Governance Result
        run: |
          if [ "${{ needs.governance.outputs.allowed }}" != "true" ]; then
            echo "[GOVERNANCE] BLOCKED"
            exit 1
          fi

          echo "[GOVERNANCE] PASSED"